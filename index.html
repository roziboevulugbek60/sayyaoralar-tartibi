<!DOCTYPE html>
<html lang="uz">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🪐 Sayyoralar Tartibi</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="game">


<header>

<h1>🪐 Sayyoralar tartibi</h1>

<p>
Sayyoralarni Quyoshdan boshlab to'g'ri joylashtiring
</p>

</header>





<div id="menu">


<input 
id="playerName"
placeholder="Ismingiz"
>


<button id="start">

🚀 Boshlash

</button>


<div class="record">

🏆 Rekord:
<span id="best">0</span>

</div>


</div>







<div id="game" class="hidden">


<div class="info">

⭐ Ball:
<span id="score">0</span>


⏱ Vaqt:
<span id="time">60</span>

</div>





<h2>
Sayyoralarni tartiblang:
</h2>



<div id="planets"></div>





<button id="check">

✅ Tekshirish

</button>



</div>








<div id="result" class="hidden">


<h2>🎉 Natija</h2>


<p>
Ball:
<b id="finalScore">
0
</b>
</p>



<button id="restart">

🔄 Qayta o'ynash

</button>


</div>






<footer>

Developer: Ulug'bek.R

</footer>


</div>




<script src="planets.js"></script>

<script src="storage.js"></script>

<script src="script.js"></script>


</body>

</html>
